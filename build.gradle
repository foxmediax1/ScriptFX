import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "${kotlin_version}"
}

repositories {
	mavenLocal()
	mavenCentral()
	maven { url = "https://maven.fabricmc.net/" } // Fabric API и Language Kotlin

	// GeckoLib
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}

	// Forge Config API Port
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}

	// Modern UI (использует репозиторий IzzelAliz)
	maven {
		name 'IzzelAliz Maven'
		url 'https://maven.izzel.io/releases/'
	}

	// AAA Particles и AAA Particles: World (используют Modrinth Maven)
	maven { url = "https://api.modrinth.com/maven" }

	// Modrinth Maven (для VFX Weaver, AAA Particles, AAA Particles: World)
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	// CurseForge Maven
	maven {
		name = "CurseForge"
		url = "https://cursemaven.com"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// GeckoLib
	implementation "com.geckolib:geckolib-fabric-26.1.2:5.5.1"
	include "com.geckolib:geckolib-fabric-26.1.2:5.5.1"

	// Forge Config API Port
	implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.5"
	include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.5"

	// Modern UI
	implementation "icyllis.modernui:ModernUI-Fabric:26.1.2-3.13.0.4"
	include "icyllis.modernui:ModernUI-Fabric:26.1.2-3.13.0.4"

	implementation "curse.maven:modern-ui-352491:8206272"
	include "curse.maven:modern-ui-352491:8206272"

	// VFX Weaver
	implementation "maven.modrinth:HBhB8m4j:oDBgLRw2"
	include "maven.modrinth:HBhB8m4j:oDBgLRw2"

	// AAA Particles
	implementation "curse.maven:aaa-particles-979809:8402887"
	include "curse.maven:aaa-particles-979809:8402887"

	// AAA Particles: World (локально)
	implementation "com.local:aaa-particles-world:2.0.0"
	include "com.local:aaa-particles-world:2.0.0"

	// Fabric Language Kotlin
	implementation "net.fabricmc:fabric-language-kotlin:${project.kotlin_loader_version}"
	include "net.fabricmc:fabric-language-kotlin:${project.kotlin_loader_version}"

	// JUnit 5 для тестов
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Kotlin test (для assertIs, assertNull и т.д.)
	testImplementation "org.jetbrains.kotlin:kotlin-test-junit5"

	testImplementation "org.mockito:mockito-core:5.11.0"

	// Arc3D — обязательная зависимость Modern UI
	implementation "icyllis.arc3d:arc3d-core:2026.1.0"
	include "icyllis.arc3d:arc3d-core:2026.1.0"

	implementation "icyllis.arc3d:arc3d-core:2026.1.0"
	include "icyllis.arc3d:arc3d-core:2026.1.0"

	implementation "icyllis.arc3d:arc3d-compiler:2026.1.0"
	include "icyllis.arc3d:arc3d-compiler:2026.1.0"

	implementation "icyllis.arc3d:arc3d-engine:2026.1.0"
	include "icyllis.arc3d:arc3d-engine:2026.1.0"

	implementation "icyllis.arc3d:arc3d-opengl:2026.1.0"
	include "icyllis.arc3d:arc3d-opengl:2026.1.0"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

def modVersion = project.version.toString()

processResources {
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25      // Java 25 для 26.1
	it.options.encoding = 'UTF-8'
}

kotlin {
	jvmToolchain(25)
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def archivesBaseName = project.base.archivesName.get()

jar {
	from("LICENSE") {
		rename { "${it}_${archivesBaseName}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
	}
}