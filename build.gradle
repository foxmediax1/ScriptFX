import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "${kotlin_version}"
}

repositories {
	mavenCentral()
	maven { url = "https://maven.fabricmc.net/" } // Fabric API и Language Kotlin

	// GeckoLib
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}

	// Forge Config API Port
	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}

	// Modern UI (использует репозиторий IzzelAliz)
	maven {
		name 'IzzelAliz Maven'
		url 'https://maven.izzel.io/releases/'
	}

	// AAA Particles и AAA Particles: World (используют Modrinth Maven)
	maven { url = "https://api.modrinth.com/maven" }

	// Modrinth Maven (для VFX Weaver, AAA Particles, AAA Particles: World)
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	// CurseForge Maven
	maven {
		name = "CurseForge"
		url = "https://cursemaven.com"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// GeckoLib
	implementation "com.geckolib:geckolib-fabric-26.1.2:5.5.1"
	include "com.geckolib:geckolib-fabric-26.1.2:5.5.1"

	// Forge Config API Port
	implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.5"
	include "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.1.5"

	// Modern UI
	implementation "icyllis.modernui:ModernUI-Fabric:26.1.2-3.13.0.4"
	include "icyllis.modernui:ModernUI-Fabric:26.1.2-3.13.0.4"

	// VFX Weaver
	implementation "maven.modrinth:HBhB8m4j:oDBgLRw2"
	include "maven.modrinth:HBhB8m4j:oDBgLRw2"

	// AAA Particles
	include "maven.modrinth:aaa-particles:2.2.3+26.1.2"
	implementation "curse.maven:aaa-particles-979809:9239381"

	// AAA Particles: World
	include "maven.modrinth:aaa-particles-world:2.0.0+26.1.2-fabric"
	implementation "curse.maven:aaa-particles-world-1157870:8279365"

	// Fabric Language Kotlin
	implementation "net.fabricmc:fabric-language-kotlin:${project.kotlin_loader_version}"
	include "net.fabricmc:fabric-language-kotlin:${project.kotlin_loader_version}"
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25      // Java 25 для 26.1
	it.options.encoding = 'UTF-8'
}

kotlin {
	jvmToolchain(25)
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}


jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
	}
}